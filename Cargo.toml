[package]
name = "korea-stock"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "한국투자증권(KIS)·토스증권(Toss) + 한국주식 무기한선물 perp(Binance·Hyperliquid·Lighter·MEXC) Rust 어댑터"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
tracing = "0.1"
dirs = "5"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
base64 = "0.22"
# Binance/MEXC USDM·Contract 서명(HMAC-SHA256).
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# Hyperliquid(DEX) 서명: EIP-712 + secp256k1 ECDSA. action msgpack 해시(keccak256)
# → Agent typed-data → k256 recoverable 서명. CEX 경로엔 불필요하나 단일 크레이트로 통합.
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
rmp-serde = "1"
# Lighter(DEX) zk 서명 nonce 등 난수.
getrandom = "0.2"
# Pacifica(DEX, Solana) Ed25519 주문 서명 + base58 키/서명 인코딩.
ed25519-dalek = "2"
bs58 = "0.5"

[features]
# 외부 소스(KRX MDC·OpenDART) 클라이언트.
# - cookies: KRX 로그인 세션.
# - native-tls: OpenDART(opendart.fss.or.kr)가 RSA-kx 전용 TLS1.2(AES128-GCM-SHA256)만
#   제공 → rustls가 핸드셰이크 거부. DART 클라이언트만 native-tls 백엔드 사용.
external = ["reqwest/cookies", "reqwest/native-tls"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
tracing-subscriber = "0.3"

