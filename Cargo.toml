[package]
name = "korea-stock"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "한국투자증권(KIS) + 토스증권(Toss) OpenAPI Rust 어댑터"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
tracing = "0.1"
dirs = "5"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
base64 = "0.22"

[features]
# 외부 소스(KRX MDC·OpenDART) 클라이언트.
# - cookies: KRX 로그인 세션.
# - native-tls: OpenDART(opendart.fss.or.kr)가 RSA-kx 전용 TLS1.2(AES128-GCM-SHA256)만
#   제공 → rustls가 핸드셰이크 거부. DART 클라이언트만 native-tls 백엔드 사용.
external = ["reqwest/cookies", "reqwest/native-tls"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
tracing-subscriber = "0.3"

[[example]]
name = "kis_domestic_quote"

[[example]]
name = "kis_domestic_order"

[[example]]
name = "kis_overseas_quote"

[[example]]
name = "kis_futureoption_quote"

[[example]]
name = "kis_realtime_feed"

[[example]]
name = "kis_lookback_probe"

[[example]]
name = "toss_quote"

[[example]]
name = "toss_order"
